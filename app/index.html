<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14162b">
<title>クソゲー大全</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <section id="screen-title" class="screen">
    <button id="btn-sound" class="corner-btn" type="button">音 ON</button>
    <h1 class="logo">クソゲー大全</h1>
    <p class="tagline">広告で見かけるあのゲームを、遊べる形で集めました</p>
    <div id="game-list" class="game-list"></div>
  </section>

  <section id="screen-levels" class="screen" hidden>
    <header class="bar">
      <button id="btn-levels-back" class="bar-btn" type="button" aria-label="ゲーム一覧へ戻る">←</button>
      <h2 id="levels-title" class="bar-title"></h2>
      <span class="bar-space"></span>
    </header>
    <div id="level-list" class="level-list"></div>
  </section>

  <section id="screen-play" class="screen" hidden>
    <canvas id="game"></canvas>
    <div id="result" class="result" hidden>
      <div class="result-card">
        <h3 id="result-title"></h3>
        <p id="result-msg"></p>
        <div class="result-btns">
          <button id="result-main" class="btn primary" type="button"></button>
          <button id="result-sub" class="btn" type="button"></button>
        </div>
      </div>
    </div>
    <header class="bar play-bar">
      <button id="btn-play-back" class="bar-btn" type="button" aria-label="レベル選択へ戻る">←</button>
      <h2 id="play-title" class="bar-title"></h2>
      <button id="btn-retry" class="bar-btn" type="button" aria-label="やり直す">↻</button>
    </header>
    <div class="play-info">
      <span id="play-hint" class="play-hint"></span>
      <span id="play-hud" class="play-hud"></span>
    </div>
  </section>
</div>

<script src="js/core.js"></script>
<script src="js/sound.js"></script>
<script src="js/games/pinpull-levels.js"></script>
<script src="js/games/pinpull-sim.js"></script>
<script src="js/games/pinpull.js"></script>
<script src="js/main.js"></script>
</body>
</html>
